<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gravador de Áudio</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="manifest" href="manifest.json">

    <link rel="icon" type="image/png" href="icons/launchericon-192x192.png">
</head>

<body>

    <main class="container-gravador">

        <section class="painel-gravador">

            <div class="icone-gravador">
                🎙️
            </div>

            <h1>Gravador de Áudio</h1>

            <p class="descricao">
                Pressione e segure o botão para começar a gravar.
            </p>

            <div class="area-gravacao">

                <button id="btn-gravador" type="button">
                    <span class="icone-botao">🎤</span>
                    <span>Segure para Gravar</span>
                </button>

            </div>

            <div class="status-container">

                <span class="indicador-status"></span>

                <p id="status-gravacao">
                    Status: Pronto para gravar
                </p>

            </div>

        </section>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
